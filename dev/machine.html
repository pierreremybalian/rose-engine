<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Machine 3D harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #16181b; overflow: hidden; font: 12px/1.3 ui-sans-serif, system-ui, sans-serif; }
      #view { position: fixed; inset: 0; }
      #bar { position: fixed; top: 8px; left: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 70vw; }
      #bar button { background: #2a2d31; color: #e7d3a1; border: 1px solid #4a4436; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
      #bar button.on { background: #6b5526; color: #fff; }
      #bar .sep { width: 8px; }
      #status { position: fixed; bottom: 8px; left: 8px; color: #b9b0a0; white-space: pre; }
      body.clean #bar, body.clean #status { display: none; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="bar"></div>
    <div id="status"></div>
    <script type="module" src="./machine.ts"></script>
  </body>
</html>
