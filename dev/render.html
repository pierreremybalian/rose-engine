<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rose Engine · render harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111214; color: #d8d4cc; font: 12px/1.3 ui-sans-serif, system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      #bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 6px 10px; background: #1b1c20; border-bottom: 1px solid #2c2d33; }
      #bar label { display: inline-flex; gap: 4px; align-items: center; }
      #bar select, #bar button, #bar input { font: inherit; background: #26272d; color: inherit; border: 1px solid #3a3b42; border-radius: 4px; padding: 2px 6px; }
      #bar button:hover { border-color: #b08d57; }
      #scrub { width: 220px; }
      #stats { margin-left: auto; font-variant-numeric: tabular-nums; color: #b08d57; }
      #view { flex: 1; min-height: 0; position: relative; }
    </style>
  </head>
  <body>
    <div id="bar">
      <label>Preset <select id="preset"></select></label>
      <label>Size <select id="size"><option value="normal">recipe</option><option value="large">large ~1.5M</option></select></label>
      <label>Mode <select id="mode"><option>ink</option><option>metal</option></select></label>
      <label>Layout <select id="layout"><option>split</option><option>machine</option><option>work</option></select></label>
      <label>Frame <select id="frame"><option>work</option><option>machine</option></select></label>
      <button id="play">Play</button>
      <label>Speed <select id="speed"><option value="1">1×</option><option value="5">5×</option><option value="20" selected>20×</option><option value="100">100×</option><option value="0">Instant</option></select></label>
      <input id="scrub" type="range" min="0" max="1" step="0.0001" value="1" />
      <label>Metal <select id="material"><option>silver</option><option>gold</option><option>rose</option><option>brass</option><option>steel</option><option>blued</option></select></label>
      <label><input id="enamel" type="checkbox" /> enamel</label>
      <input id="enamelColor" type="color" value="#1b3fa0" />
      <label>Light <input id="light" type="range" min="0" max="360" value="35" /></label>
      <label>Cam <select id="camera"><option>overview</option><option>rosette</option><option>tool</option></select></label>
      <button id="zoom8">Zoom 8×</button>
      <button id="reset">Fit</button>
      <button id="png">PNG</button>
      <label>Machine <select id="machine"><option value="real">real</option><option value="stub">stub</option></select></label>
      <span id="stats"></span>
    </div>
    <div id="view"></div>
    <script type="module" src="./render.ts"></script>
  </body>
</html>
